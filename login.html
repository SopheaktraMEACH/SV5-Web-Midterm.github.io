<body class="index-page">
  <header></header>

  <main class="main service-details section">
    <section id="service-details" class="service-details section">
      <div class="container">
        <div class="row gy-5">
          <div class="col-lg-4 mx-auto">
            <div class="card p-3">
              <div class="mb-3 text-center"><label class="form-label fs-3 text-primary fw-semibold">Login Form</label>

              <div class="input-group mb-3">

                  <label class="form-check-label" for="checkDefault">
                    Keep me logged-in

                </div>
              </div>
              <div class="input-group mb-3"><button type="button" class="btn btn-primary w-100" id="loginBtn">Login</button></div>
              <div class="input-group mb-1"><label class="form-label">Or Login vai</label></div>
              <div class="input-group mb-3"><button type="button" class="form-control btn btn-primary btn-sm w-50"

  <!-- Added login functionality -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const loginBtn = document.getElementById('loginBtn');
      
      loginBtn.addEventListener('click', function() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        
        if (username === 'admin' && password === '123') {
          // Redirect to dashboard.html
          window.location.href = 'dashboard.html';
        } else {
          alert('Invalid username or password');
        }
      });
      
      // Optional: Allow login on Enter key press
      document.getElementById('password').addEventListener('keyup', function(event) {
        if (event.key === 'Enter') {
          loginBtn.click();
        }
      });
    });
  </script>
